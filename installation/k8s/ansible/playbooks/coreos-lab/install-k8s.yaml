---
- name: Wait for nodes to boot into the custom FCOS deployment
  hosts: coreos_lab
  gather_facts: false
  tasks:
    - name: Wait for /usr/bin/python3 from the custom image
      ansible.builtin.raw: test -x /usr/bin/python3
      register: python_check
      until: python_check.rc == 0
      retries: 40
      delay: 15
      changed_when: false

- name: Prepare Fedora CoreOS Kubernetes nodes
  hosts: coreos_lab
  become: true
  gather_facts: true
  serial: 1
  vars:
    kubernetes_image_archive: "{{ playbook_dir }}/../../../coreos-lab/output/fcos-kubernetes.ociarchive"
    kube_vip_manifest: "{{ playbook_dir }}/../../../../../manifests/platform/kube-vip/kube-vip.yaml"
    remote_image_archive: /var/lib/fcos-kubernetes.ociarchive
    expected_kubernetes_minor: "1.36"
  pre_tasks:
    - name: Require Fedora CoreOS
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Fedora'
          - ansible_facts.os_family == 'RedHat'
        fail_msg: This playbook is for Fedora CoreOS nodes only.

    - name: Require an x86_64 node
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture in ['x86_64', 'amd64']
        fail_msg: The custom image is built for x86_64 nodes.

    - name: Require the custom image archive on the controller
      ansible.builtin.stat:
        path: "{{ kubernetes_image_archive }}"
      delegate_to: localhost
      become: false
      register: image_archive
      run_once: true

    - name: Stop when the custom image archive is missing
      ansible.builtin.assert:
        that: image_archive.stat.exists
        fail_msg: Build the custom FCOS image first and ensure the OCI archive exists.
      run_once: true

    - name: Require the kube-vip manifest on the controller
      ansible.builtin.stat:
        path: "{{ kube_vip_manifest }}"
      delegate_to: localhost
      become: false
      register: kube_vip_file
      run_once: true

    - name: Stop when the kube-vip manifest is missing
      ansible.builtin.assert:
        that: kube_vip_file.stat.exists
        fail_msg: Generate manifests/platform/kube-vip/kube-vip.yaml first.
      run_once: true

  tasks:
    - name: Set the persistent node hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Disable active swap
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Mask swap units
      ansible.builtin.systemd:
        name: swap.target
        masked: true

    - name: Load Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load Kubernetes kernel modules
      ansible.builtin.command: modprobe {{ item }}
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Apply Kubernetes sysctls
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Create CNI directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/cni/net.d
        - /opt/cni/bin

    - name: Copy custom Kubernetes FCOS image archive
      ansible.builtin.copy:
        src: "{{ kubernetes_image_archive }}"
        dest: "{{ remote_image_archive }}"
        mode: "0644"
      register: image_copy

    - name: Rebase to the custom Kubernetes FCOS image
      ansible.builtin.command:
        cmd: >-
          rpm-ostree rebase --bypass-driver
          ostree-unverified-image:oci-archive:{{ remote_image_archive }}
      when: image_copy.changed
      register: rebase_result
      changed_when: true

    - name: Reboot after image rebase
      ansible.builtin.reboot:
        msg: Rebooting into the custom Kubernetes FCOS deployment
        reboot_timeout: 900
      when: image_copy.changed

    - name: Wait for node to come back from reboot
      ansible.builtin.wait_for_connection:
        timeout: 900
      when: image_copy.changed

    - name: Confirm custom image is active after reboot
      ansible.builtin.command: test -x /usr/bin/python3
      changed_when: false
      when: image_copy.changed

    - name: kubelet depends on CRI-O
      ansible.builtin.copy:
        dest: /etc/systemd/system/kubelet.service.d/10-kubernetes.conf
        mode: "0644"
        content: |
          [Unit]
          Requires=crio.service
          After=crio.service

    - name: Enable and start CRI-O
      ansible.builtin.systemd:
        name: crio.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable kubelet for manual kubeadm bootstrap
      ansible.builtin.systemd:
        name: kubelet.service
        enabled: true
        state: started

    - name: Install kube-vip static pod manifest
      ansible.builtin.copy:
        src: "{{ kube_vip_manifest }}"
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        mode: "0644"

    - name: Use super-admin kubeconfig during kubeadm bootstrap
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/kube-vip.yaml
        regexp: /etc/kubernetes/admin\.conf
        replace: /etc/kubernetes/super-admin.conf

    - name: Verify Kubernetes binaries
      ansible.builtin.shell: "command -v {{ item }}"
      loop:
        - kubeadm
        - kubelet
        - kubectl
        - crio
      changed_when: false

    - name: Verify CRI-O socket
      ansible.builtin.stat:
        path: /var/run/crio/crio.sock
      register: crio_socket

    - name: Require the CRI-O socket
      ansible.builtin.assert:
        that: crio_socket.stat.exists
        fail_msg: CRI-O is installed but its socket was not created.

    - name: Display manual next steps
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is prepared. The first inventory host will
          be initialized automatically, followed by control-plane joins for
          the remaining hosts. Kubernetes minor stream configured for the
          image: {{ expected_kubernetes_minor }}.

- name: Initialize the first control-plane node
  hosts: coreos_lab
  become: true
  gather_facts: false
  serial: 1
  vars:
    control_plane_endpoint: 192.168.0.201:6443
    pod_network_cidr: 172.16.0.0/12
  tasks:
    - name: Check whether the first control plane is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf_pre
      when: inventory_hostname == groups['coreos_lab'][0]

    - name: Initialize the first control plane with kubeadm
      ansible.builtin.command:
        cmd: >-
          kubeadm init
          --control-plane-endpoint {{ control_plane_endpoint }}
          --pod-network-cidr {{ pod_network_cidr }}
          --upload-certs
          --cri-socket unix:///var/run/crio/crio.sock
      when: inventory_hostname == groups['coreos_lab'][0] and not admin_conf_pre.stat.exists
      register: kubeadm_init

    - name: Revert kube-vip to the admin kubeconfig after initialization
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/kube-vip.yaml
        regexp: /etc/kubernetes/super-admin\.conf
        replace: /etc/kubernetes/admin.conf
      when: inventory_hostname == groups['coreos_lab'][0] and not (kubeadm_init.skipped | default(false))

    - name: Re-check admin.conf after potential initialization
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf
      when: inventory_hostname == groups['coreos_lab'][0]

    - name: Wait for the control plane endpoint to answer
      ansible.builtin.wait_for:
        host: "{{ (control_plane_endpoint.split(':'))[0] }}"
        port: 6443
        timeout: 300
      when: inventory_hostname == groups['coreos_lab'][0] and admin_conf.stat.exists

    - name: Generate the control-plane certificate key
      ansible.builtin.command:
        cmd: kubeadm init phase upload-certs --upload-certs
      when: inventory_hostname == groups['coreos_lab'][0] and admin_conf.stat.exists
      register: upload_certs
      changed_when: false
      no_log: true

    - name: Create a control-plane join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command --kubeconfig /etc/kubernetes/admin.conf
      when: inventory_hostname == groups['coreos_lab'][0] and admin_conf.stat.exists
      register: join_command
      until: join_command.rc == 0
      retries: 20
      delay: 15
      changed_when: false
      no_log: false

    - name: Save the control-plane join command
      ansible.builtin.set_fact:
        control_plane_join_command: >-
          {{ join_command.stdout }} --control-plane --certificate-key
          {{ upload_certs.stdout_lines | select('match', '^[0-9a-f]{64}$') | list | last }}
      when: inventory_hostname == groups['coreos_lab'][0] and admin_conf.stat.exists
      no_log: true

- name: Join the remaining control-plane nodes
  hosts: coreos_lab
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Check whether the control-plane node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf
      when: inventory_hostname != groups['coreos_lab'][0]

    - name: Join control-plane node to the cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['coreos_lab'][0]].control_plane_join_command }} --cri-socket unix:///var/run/crio/crio.sock"
      when: inventory_hostname != groups['coreos_lab'][0] and not kubelet_conf.stat.exists
      no_log: true
