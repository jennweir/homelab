apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gsm-secret-store
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  retrySettings:
    maxRetries: 5
    retryInterval: 30s
  provider:
    gcpsm:
      projectID: coreos-k8s-lab
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/138245118216/locations/global/workloadIdentityPools/k8s-pool/providers/k8s-provider
          serviceAccountRef:
            name: cert-manager
            namespace: cert-manager
            audiences:
              - //iam.googleapis.com/projects/138245118216/locations/global/workloadIdentityPools/k8s-pool/providers/k8s-provider
