apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: force-https
  namespace: gateway-infra
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: web-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
