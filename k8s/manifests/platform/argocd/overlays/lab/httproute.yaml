apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
  - name: argocd
    namespace: argocd
    kind: ListenerSet
    group: gateway.networking.k8s.io
    sectionName: argocd-https
  hostnames:
  - "argocd.homelab.jenniferpweir.com"
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      namespace: argocd
      port: 443
      weight: 1
    matches:
      - path:
          type: PathPrefix
          value: /
