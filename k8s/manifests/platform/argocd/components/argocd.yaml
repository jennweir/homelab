kind: ArgoCD
apiVersion: argoproj.io/v1beta1
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sourceNamespaces:
    - argocd-operator
    - cert-manager
    - olmv1-system
  controller:
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  ha:
    enabled: false
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  redis:
    # specify image manually to avoid imagePullBackoff from enabling shortname enforcement in cri-o v1.34
    image: public.ecr.aws/docker/library/redis:8.4.0
    version: sha256:47200b04138293fae39737e50878a238b13ec0781083126b1b0c63cf5d992e8d
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  repo:
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  server:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    route:
      enabled: true
