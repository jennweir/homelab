apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lab-l2-policy
  namespace: kube-system
spec:
  # No serviceSelector means every Service is eligible. Only Services that have
  # a LoadBalancer IP (loadBalancerIPs) or externalIPs are actually announced,
  # so this covers both Cilium Gateway-owned Services and plain LoadBalancer
  # Services like sable-dns.
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  interfaces:
  - ^eth[0-9]+$        # Matches network interfaces like eth0, eth1.
  - ^enp[0-9]+s[0-9]+$ # Matches network interfaces like enp3s0.
  - ^eno[0-9]+$        # Added for Fedora CoreOS onboard NIC defaults
  externalIPs: true
  loadBalancerIPs: true
