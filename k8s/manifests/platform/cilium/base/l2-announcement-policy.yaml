apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lab-l2-announcement
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  externalIPs: true
  interfaces:
    - ^eth[0-9]+$
    - ^enp[0-9]+s[0-9]+$
    - ^eno[0-9]+$
  loadBalancerIPs: true
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
