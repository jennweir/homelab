apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openshell
  labels:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: openshell
spec:
  serviceName: openshell-peer
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell
        app.kubernetes.io/instance: openshell
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: openshell
      securityContext:
        fsGroup: 1000
      containers:
        - name: openshell-gateway
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/nvidia/openshell/gateway:0.1.8@sha256:d66352a54c680b652e5ddd7d19b9c1189568d18016f360b9b8c64014f13d89c4
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/openshell/gateway.toml
            - --db-url
            - sqlite:/var/openshell/openshell.db
          env:
            - name: OPENSHELL_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPENSHELL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPENSHELL_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPENSHELL_SERVICE_ACCOUNT_NAME
              value: openshell
            - name: OPENSHELL_PEER_SERVICE_NAME
              value: openshell-peer
            - name: OPENSHELL_PEER_TOKEN_AUDIENCE
              value: openshell-gateway-peer
            - name: OPENSHELL_PEER_SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/openshell-peer/token
            - name: OPENSHELL_PEER_POD_LABELS
              value: app.kubernetes.io/name=openshell,app.kubernetes.io/instance=openshell
            - name: OPENSHELL_PEER_TLS_SERVER_NAME
              value: openshell.openshell.svc.cluster.local
            - name: OPENSHELL_PEER_TLS_CA_FILE
              value: /etc/openshell-tls/server/ca.crt
            - name: OPENSHELL_PEER_TLS_CERT_FILE
              value: /etc/openshell-tls/peer-client/tls.crt
            - name: OPENSHELL_PEER_TLS_KEY_FILE
              value: /etc/openshell-tls/peer-client/tls.key
            - name: OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: openshell-key-encryption-key
                  key: key-encryption-key
            - name: XDG_STATE_HOME
              value: /var/lib/openshell-state
            - name: OPENSHELL_TELEMETRY_ENABLED
              value: "true"
          volumeMounts:
            - name: openshell-data
              mountPath: /var/openshell
            - name: gateway-config
              mountPath: /etc/openshell/gateway.toml
              subPath: gateway.toml
              readOnly: true
            - name: sandbox-jwt
              mountPath: /etc/openshell-jwt
              readOnly: true
            - name: gateway-peer-token
              mountPath: /var/run/secrets/openshell-peer
              readOnly: true
            - name: tls-cert
              mountPath: /etc/openshell-tls/server
              readOnly: true
            - name: peer-client-tls
              mountPath: /etc/openshell-tls/peer-client
              readOnly: true
            - name: tls-client-ca
              mountPath: /etc/openshell-tls/client-ca
              readOnly: true
            - name: gateway-state
              mountPath: /var/lib/openshell-state
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          resources: {}
      volumes:
        - name: gateway-config
          configMap:
            name: openshell-config
        - name: sandbox-jwt
          secret:
            secretName: openshell-jwt-keys
            defaultMode: 256
        - name: gateway-peer-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openshell-gateway-peer
                  expirationSeconds: 3600
        - name: tls-cert
          secret:
            secretName: openshell-server-tls
        - name: peer-client-tls
          secret:
            secretName: openshell-client-tls
        - name: tls-client-ca
          secret:
            secretName: openshell-server-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: gateway-state
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: openshell-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
