apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openshell-key-encryption-key
  namespace: openshell
  labels:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: openshell
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: openshell-secret-store
    kind: SecretStore
  target:
    name: openshell-key-encryption-key
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: openshell
          app.kubernetes.io/instance: openshell
  data:
    - secretKey: key-encryption-key
      remoteRef:
        key: openshell-key
