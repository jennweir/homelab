apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openshell-secret-store
  namespace: openshell
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  retrySettings:
    maxRetries: 5
    retryInterval: 30s
  provider:
    gcpsm:
      projectID: coreos-k8s-lab
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/138245118216/locations/global/workloadIdentityPools/k8s-pool/providers/k8s-provider
          serviceAccountRef:
            name: openshell-eso-sa
            namespace: openshell
            audiences:
              - //iam.googleapis.com/projects/138245118216/locations/global/workloadIdentityPools/k8s-pool/providers/k8s-provider
