kind: Service
apiVersion: v1
metadata:
  name: sable-dns
  namespace: sable
spec:
  selector:
    app: sable
  type: LoadBalancer
  ports:
    - name: udp-dns
      port: 53
      targetPort: udp-dns
      protocol: UDP
    - name: tcp-dns
      port: 53
      targetPort: tcp-dns
      protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: sable-web
  namespace: sable
spec:
  selector:
    app: sable
  type: ClusterIP
  ports:
    - name: console
      port: 5380
      targetPort: console
      protocol: TCP
