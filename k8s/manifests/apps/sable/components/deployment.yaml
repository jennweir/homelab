apiVersion: apps/v1
kind: Deployment
metadata:
  name: sable
  namespace: sable
spec:
  selector:
    matchLabels:
      app: sable
  replicas: 1
  template:
    metadata:
      labels:
        app: sable
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      automountServiceAccountToken: false
      # the image runs as "nonroot" but ships no /etc/passwd, so runAsUser must be numeric for runAsNonRoot to pass admission; fsGroup makes the emptyDir volume writable
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      # independent resolvers so startup and block-list downloads never depend on sable itself
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 9.9.9.9
      containers:
        - name: sable
          image: ghcr.io/drudge/sable:1.7.2@sha256:27731daa5467fa8a455f79ccd0d0af83e9afaed54540b1e075e1fdda5f824740
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi
          envFrom:
            - configMapRef:
                name: sable
          ports:
            - name: udp-dns
              containerPort: 8053
              protocol: UDP
            - name: tcp-dns
              containerPort: 8053
              protocol: TCP
            - name: console
              containerPort: 5380
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: tcp-dns
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: tcp-dns
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            privileged: false
          volumeMounts:
            - name: sable-data-volume
              mountPath: /data
            - name: sable-config
              mountPath: /data/sable.toml
              subPath: sable.toml
      volumes:
        - name: sable-data-volume
          persistentVolumeClaim:
            claimName: sable-data
        - name: sable-config
          configMap:
            name: sable
            items:
              - key: sable.toml
                path: sable.toml
