apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sable
  namespace: sable
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: sable
      namespace: sable
      kind: ListenerSet
      group: gateway.networking.k8s.io
      sectionName: sable-https
  hostnames:
    - "dns.homelab.jenniferpweir.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: sable-web
          namespace: sable
          port: 5380
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
