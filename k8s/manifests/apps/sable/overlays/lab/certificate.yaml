apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sable
  namespace: sable
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: sable-certificate-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "dns.homelab.jenniferpweir.com"
