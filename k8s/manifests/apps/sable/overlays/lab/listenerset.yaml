apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: sable
  namespace: sable
spec:
  parentRef:
    name: web-gateway
    namespace: gateway-infra
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: sable-https
      protocol: HTTPS
      port: 443
      hostname: "sable.homelab.jenniferpweir.com"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: sable-certificate-secret
