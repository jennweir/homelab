---
- name: Install Cilium CNI on the CoreOS Kubernetes cluster
  hosts: coreos_lab
  become: true
  vars:
    cilium_manifest_src: "{{ playbook_dir }}/../../../manifests/platform/cilium/lab/cilium.yaml"
    remote_manifest: /etc/kubernetes/cilium.yaml
    control_plane_endpoint: 192.168.0.201:6443
    expected_pod_cidr: 172.16.0.0/12

  pre_tasks:
    - name: Check whether the cluster is initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf
      when: inventory_hostname == groups['coreos_lab'][0]
      run_once: true

    - name: Stop when the cluster is not initialized
      ansible.builtin.assert:
        that: admin_conf.stat.exists
        fail_msg: The control plane is not initialized; run install-k8s.yaml first.
      run_once: true

    - name: Require the expected pod CIDR in the manifest
      ansible.builtin.assert:
        that: expected_pod_cidr in lookup('ansible.builtin.file', cilium_manifest_src)
        fail_msg: >-
          {{ cilium_manifest_src }} does not contain pod CIDR
          {{ expected_pod_cidr }}; regenerate it with generate-manifest.sh.

  tasks:
    - name: Copy the Cilium manifest to each node
      ansible.builtin.copy:
        src: "{{ cilium_manifest_src }}"
        dest: "{{ remote_manifest }}"
        mode: "0644"

    - name: Wait for the control plane endpoint to answer
      ansible.builtin.wait_for:
        host: "{{ (control_plane_endpoint.split(':'))[0] }}"
        port: 6443
        timeout: 300
      when: inventory_hostname == groups['coreos_lab'][0]

    - name: Apply the Cilium manifest to the cluster
      ansible.builtin.command:
        cmd: kubectl apply -f {{ remote_manifest }} --kubeconfig /etc/kubernetes/admin.conf
      when: inventory_hostname == groups['coreos_lab'][0]
      run_once: true
      register: cilium_apply
      changed_when: "' created' in cilium_apply.stdout or ' configured' in cilium_apply.stdout"

    - name: Wait for the Cilium DaemonSet to roll out
      ansible.builtin.command:
        cmd: kubectl -n kube-system rollout status daemonset/cilium --kubeconfig /etc/kubernetes/admin.conf --timeout=600s
      when: inventory_hostname == groups['coreos_lab'][0]
      run_once: true
      changed_when: false
