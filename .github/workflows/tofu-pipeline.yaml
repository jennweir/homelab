name: OpenTofu CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "opentofu/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan - ${{ matrix.dir }}
    strategy:
      matrix:
        include:
          - dir: k8s-lab
            wif_provider: ${{ vars.GH_WIF_PROVIDER_K8S_LAB }}
            service_account: ${{ vars.GSA_EMAIL_K8S_LAB_PLAN }}
            azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          - dir: pi-cluster
            wif_provider: ${{ vars.GH_WIF_PROVIDER_PI_CLUSTER }}
            service_account: ${{ vars.GSA_EMAIL_PI_CLUSTER_PLAN }}
            azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: "1.10.0"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ matrix.wif_provider }}
          service_account: ${{ matrix.service_account }}

      - name: OpenTofu Init
        id: init
        working-directory: ${{ format('opentofu/{0}', matrix.dir) }}
        run: tofu init

      - name: OpenTofu Plan
        id: plan
        working-directory: ${{ format('opentofu/{0}', matrix.dir) }}
        run: |
          set +e
          tofu plan -no-color -detailed-exitcode -out=tfplan -var="azure_tenant_id=${{ matrix.azure_tenant_id }}" 2>&1 | tee plan_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ -s plan_output.txt ]; then
            if [ $(wc -c < plan_output.txt) -gt 65000 ]; then
              head -c 65000 plan_output.txt > plan_output.txt
              echo "..." >> plan_output.txt
            fi
          fi
          changes=$(grep -oP 'Plan: \K\d+' plan_output.txt || echo "0")
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tfplan-${{ matrix.dir }}
          path: ${{ format('opentofu/{0}/', matrix.dir) }}tfplan
          retention-days: 5

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');

            let planOutput = 'Plan output not available.';
            try {
              planOutput = fs.readFileSync('${{ format('opentofu/{0}/', matrix.dir) }}plan_output.txt', 'utf8') || 'Plan output not available.';
            } catch (e) {
              planOutput = 'Plan output not available.';
            }

            const planMatch = planOutput.match(/Plan:\s*(\d+)\s+to add,\s*(\d+)\s+to change,\s*(\d+)\s+to destroy\./);
            const hasChanges = planMatch && (parseInt(planMatch[1]) > 0 || parseInt(planMatch[2]) > 0 || parseInt(planMatch[3]) > 0);

            console.log('issue_number:', context.issue.number);
            console.log('hasChanges:', hasChanges);
            console.log('planMatch:', planMatch);

            const body = [
              '## OpenTofu Plan',
              '',
              hasChanges
                ? '### ⚠️ **Changes detected**'
                : '### ✅ **No changes detected**',
              '',
              hasChanges
                ? ['```', planOutput, '```'].join('\n')
                : 'Infrastructure is up to date.',
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });

              const botComment = comments.find(c =>
                c.user.login === 'github-actions[bot]' &&
                c.body && c.body.includes('## OpenTofu Plan')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
              console.log('Comment posted/updated successfully');
            } catch (e) {
              console.error('Failed to post comment:', e.message);
              throw e;
            }
  apply:
    name: Apply - ${{ matrix.dir }}
    needs: plan
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    strategy:
      matrix:
        include:
          - dir: k8s-lab
            wif_provider: ${{ vars.GH_WIF_PROVIDER_K8S_LAB }}
            service_account: ${{ vars.GSA_EMAIL_K8S_LAB_APPLY }}
            azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          - dir: pi-cluster
            wif_provider: ${{ vars.GH_WIF_PROVIDER_PI_CLUSTER }}
            service_account: ${{ vars.GSA_EMAIL_PI_CLUSTER_APPLY }}
            azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      fail-fast: false
    environment: production
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: "1.10.0"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ matrix.wif_provider }}
          service_account: ${{ matrix.service_account }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.dir }}
          path: ${{ format('opentofu/{0}', matrix.dir) }}

      - name: OpenTofu Init
        working-directory: ${{ format('opentofu/{0}', matrix.dir) }}
        run: tofu init

      - name: OpenTofu Apply
        working-directory: ${{ format('opentofu/{0}', matrix.dir) }}
        run: tofu apply -auto-approve -no-color -var="azure_tenant_id=${{ matrix.azure_tenant_id }}" tfplan
